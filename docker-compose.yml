services:
  db:
    image: postgres:16-alpine
    container_name: currency_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-currency}
      POSTGRES_USER: ${POSTGRES_USER:-currency_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-currency_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: currency_api
    command: >
      python -m uvicorn main:app
      --host 0.0.0.0
      --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://currency_user:currency_password@db:5432/currency}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_DOCKER_SECRET_KEY}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  parser:
    build: .
    container_name: currency_parser
    command: >
      sh -c "
      python -m scrapy crawl cbr;
      while true;
      do
        sleep 86400;
        python -m scrapy crawl cbr;
      done
      "
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://currency_user:currency_password@db:5432/currency}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_DOCKER_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
