[project]
name = "python-currency-service"
version = "0.1.0"
description = "Python service for parsing and check currency rate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "email-validator>=2.0.0",
    "fastapi>=0.136.3",
    "greenlet>=3.0.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "scrapy>=2.14.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.0.0",
    "ruff>=0.8.0",
]

[tool.black]
line-length = 79
target-version = ["py312"]
skip-string-normalization = true

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []
